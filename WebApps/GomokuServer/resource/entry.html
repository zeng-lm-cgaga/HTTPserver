<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级无敌宇宙miniGomoku</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #1b2940 0, #050816 40%, #020309 100%);
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* 背景光效 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            z-index: 0;
        }

        .bg-circle.c1 {
            width: 260px;
            height: 260px;
            background: #00bfff;
            top: -60px;
            left: -40px;
        }

        .bg-circle.c2 {
            width: 300px;
            height: 300px;
            background: #ff6bcb;
            bottom: -80px;
            right: -40px;
        }

        .bg-circle.c3 {
            width: 220px;
            height: 220px;
            background: #ffd56b;
            bottom: 10%;
            left: 15%;
        }

        h1.title {
            font-size: 40px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 30px;
            z-index: 1;
            background: linear-gradient(120deg, #00e0ff, #8a7dff, #ff9a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 14px;
            color: #cbd5f5;
            margin-top: -20px;
            margin-bottom: 20px;
            z-index: 1;
            opacity: 0.85;
        }

        .auth-wrapper {
            display: flex;
            gap: 24px;
            z-index: 1;
            align-items: stretch;
        }

        .container {
            width: 340px;
            padding: 24px 24px 20px;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.22), rgba(10, 14, 35, 0.9));
            border-radius: 14px;
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.18), rgba(255, 255, 255, 0.03));
            opacity: 0.7;
            pointer-events: none;
        }

        .container-inner {
            position: relative;
            z-index: 1;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 8px;
            text-align: left;
            color: #e5edff;
        }

        .tip-text {
            font-size: 12px;
            color: #9aa4d4;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #c7d2ff;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 255, 0.5);
            background: rgba(15, 23, 42, 0.8);
            color: #e5edff;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input::placeholder {
            color: #6b7280;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.5), 0 8px 20px rgba(15, 23, 42, 0.7);
            background: rgba(15, 23, 42, 0.95);
        }

        .btn {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
            transition: all 0.18s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 32px rgba(56, 189, 248, 0.45);
            filter: brightness(1.03);
        }

        .btn:active {
            transform: translateY(0px) scale(0.99);
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.9);
        }

        .switch {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            color: #9aa4d4;
        }

        .switch a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .switch a:hover {
            text-decoration: underline;
        }

        #register-container {
            display: none;
        }

        /* 顶部提示 */
        #success-alert {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 10px 22px;
            border-radius: 999px;
            box-shadow: 0 12px 30px rgba(34, 197, 94, 0.5);
            display: none;
            z-index: 1000;
            font-size: 14px;
        }

        #success-alert::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background-color: #bbf7d0;
            margin-right: 8px;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.4);
        }

        /* 底部小提示 */
        .footer-tip {
            margin-top: 20px;
            font-size: 12px;
            color: #6b7280;
            z-index: 1;
        }

        /* 小屏幕适配 */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .auth-wrapper {
                flex-direction: column;
                gap: 16px;
            }

            h1.title {
                font-size: 32px;
            }

            .subtitle {
                margin-bottom: 10px;
            }

            .container {
                width: 100%;
                max-width: 380px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>
    <div class="bg-circle c3"></div>

    <div id="success-alert">提示信息</div>

    <h1 class="title">超级无敌宇宙miniGomoku</h1>
    <div class="subtitle">登录后体验对战 AI、玩家匹配等丰富玩法</div>

    <div class="auth-wrapper">
        <!-- 登录界面 -->
        <div class="container" id="login-container">
            <div class="container-inner">
                <h2>登录</h2>
                <div class="tip-text">使用账号密码登录您的棋局世界</div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn">登录</button>
                </form>
                <div class="switch">
                    没有账号？<a onclick="showRegister()">去注册账号</a>
                </div>
            </div>
        </div>

        <!-- 注册界面 -->
        <div class="container" id="register-container">
            <div class="container-inner">
                <h2>注册</h2>
                <div class="tip-text">创建一个属于你的五子棋账号</div>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-username">用户名</label>
                        <input type="text" id="register-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn">注册</button>
                </form>
                <div class="switch">
                    已有账号？<a onclick="showLogin()">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-tip">为获得更佳体验，推荐在现代浏览器中访问本游戏</div>

    <script>
        // 显示蓝色提示框
        function showAlert(message) {
            const alertBox = document.getElementById('success-alert');
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 1000);
        }

        // 切换注册和登录界面
        function showRegister() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('register-container').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('register-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
        }

        // 登录表单提交
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
                .then(response => {
                    // 先检查响应状态
                    if (response.status === 403) {
                        showAlert('账号已在其他地方登录！');
                        throw new Error('已在其他地方登录');
                    }

                    // 检查其他状态和内容类型
                    const contentType = response.headers.get('content-type');
                    if (response.status === 200) {
                        if (contentType && contentType.includes('application/json')) {
                            return response.json();
                        } else {
                            throw new Error('返回格式错误');
                        }
                    } else if (response.status === 401) {
                        showAlert('账号或密码错误！');
                        throw new Error('认证失败');
                    } else {
                        throw new Error('请求失败');
                    }
                })
                .then(data => {
                    if (data && data.userId) {
                        sessionStorage.setItem('userId', data.userId);
                        showAlert('登录成功！');
                        // 使用重定向而不是fetch
                        window.location.href = '/menu';
                    } else {
                        throw new Error('无效的响应数据');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    if (!error.message.includes('已在其他地方登录') &&
                        !error.message.includes('认证失败')) {
                        showAlert('操作失败，请重试');
                    }
                });
        });

        // 注册表单提交
        document.getElementById('register-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;

            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
                .then(response => {
                    if (response.status === 200) {
                        showAlert('注册成功！');

                        // 将注册的用户名和密码填充到登录输入框
                        document.getElementById('login-username').value = username;
                        document.getElementById('login-password').value = password;

                        setTimeout(showLogin, 1000); // 1秒后回到登录界面
                    } else if (response.status === 409) {
                        alert('用户名已被注册，请重新输入！');
                    }
                })
                .catch(error => console.error('注册错误:', error));
        });

    </script>
</body>

</html>
