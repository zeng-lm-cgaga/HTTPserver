<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级无敌宇宙miniGomoku</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 全局样式 */
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: radial-gradient(circle at top, #111827 0, #020617 40%, #020308 100%);
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰 */
        .bg-orbit {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(148, 163, 255, 0.4);
            width: 460px;
            height: 460px;
            top: -120px;
            right: -160px;
            opacity: 0.5;
        }

        .bg-orbit::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8, #0ea5e9);
            top: 18%;
            left: 8%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
        }

        .bg-gradient-blob {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.6;
            background: conic-gradient(from 120deg, #22c55e, #0ea5e9, #6366f1, #22c55e);
            left: -80px;
            bottom: -120px;
        }

        /* 加载动画容器 */
        #loading-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 加载标题 */
        #loading-title {
            font-size: 2.4em;
            margin-bottom: 24px;
            color: #e5edff;
            letter-spacing: 4px;
            text-shadow: 0 10px 25px rgba(15, 23, 42, 0.8);
            background: linear-gradient(120deg, #38bdf8, #818cf8, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 进度条 */
        .progress-bar {
            width: 260px;
            height: 14px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 255, 0.4);
        }

        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #38bdf8, #6366f1);
            width: 0;
            transition: width 1.5s ease;
        }

        /* 加载提示文字 */
        #loading-text {
            margin-top: 16px;
            font-size: 0.95em;
            color: #9ca3af;
        }

        /* 菜单页面样式 */
        #menu-container {
            display: none;
            text-align: center;
            padding: 40px 16px;
            position: relative;
            z-index: 1;
        }

        .menu-card {
            max-width: 560px;
            margin: 0 auto;
            padding: 26px 22px 24px;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.18), rgba(15, 23, 42, 0.95));
            border-radius: 18px;
            box-shadow:
                0 28px 80px rgba(15, 23, 42, 0.95),
                0 0 0 1px rgba(148, 163, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        h1 {
            font-size: 2.3em;
            margin-bottom: 8px;
            color: #e5edff;
        }

        .menu-subtitle {
            font-size: 0.95em;
            color: #a5b4fc;
            margin-bottom: 22px;
        }

        .menu-border {
            margin: 14px auto 18px;
            width: 82%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .menu-option-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .menu-option {
            padding: 10px 16px;
            font-size: 1.05em;
            color: #e5edff;
            cursor: pointer;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(148, 163, 255, 0.25);
            background: radial-gradient(circle at left, rgba(56, 189, 248, 0.24), rgba(15, 23, 42, 0.96));
            transition: all 0.18s ease;
        }

        .menu-option span.key {
            font-size: 0.9em;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 255, 0.5);
            background: rgba(15, 23, 42, 0.9);
            color: #9ca3af;
            margin-right: 8px;
        }

        .menu-option span.desc {
            flex: 1;
            text-align: left;
            padding-left: 4px;
        }

        .menu-option span.meta {
            font-size: 0.8em;
            color: #9ca3af;
        }

        .menu-option:hover {
            color: #f9fafb;
            border-color: rgba(56, 189, 248, 0.7);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.9);
            transform: translateY(-1px);
        }

        /* 输入提示样式（保留以兼容旧逻辑，如果后面有输入） */
        #input-hint {
            font-size: 1.2em;
            margin-top: 20px;
            color: #00e1ff;
        }

        input {
            margin-top: 10px;
            font-size: 1em;
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            text-align: center;
            background-color: #333;
            color: #fff;
        }

        .menu-footer {
            margin-top: 18px;
            font-size: 0.8em;
            color: #6b7280;
        }

        /* 返回登录按钮样式 */
        .back-entry-btn {
            margin-top: 18px;
            padding: 8px 16px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #fff;
            font-size: 0.9em;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.45);
            transition: all 0.15s ease;
        }

        .back-entry-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.55);
        }

        @media (max-width: 640px) {
            #loading-title {
                font-size: 2em;
            }

            .menu-card {
                margin: 0 16px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-orbit"></div>
    <div class="bg-gradient-blob"></div>

    <!-- 加载动画 -->
    <div id="loading-container">
        <div id="loading-title">超级无敌宇宙miniGomoku</div>
        <div class="progress-bar">
            <div class="progress-bar-inner"></div>
        </div>
        <div id="loading-text">加载中...</div>
    </div>

    <!-- 菜单页面 -->
    <div id="menu-container">
        <div class="menu-card">
            <h1>欢迎来到超级无敌宇宙miniGomoku</h1>
            <div class="menu-subtitle">选择一种模式开始对局</div>
            <div class="menu-border"></div>

            <div class="menu-option-list">
                <div class="menu-option" id="play-ai">
                    <span class="desc">对战 AI</span>
                    <span class="meta">推荐 · 提升棋力</span>
                </div>
                <div class="menu-option">
                    <span class="desc">匹配玩家</span>
                    <span class="meta">敬请期待</span>
                </div>
                <div class="menu-option" id="exit-game">
                    <span class="desc">退出游戏</span>
                    <span class="meta">关闭网页即可</span>
                </div>
            </div>

            <div class="menu-footer">如长时间无响应，请刷新页面重新进入菜单</div>

            <button class="back-entry-btn" id="back-to-entry">返回登录界面</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            console.log('Page loaded'); // 调试日志

            const progressBar = document.querySelector('.progress-bar-inner');
            const loadingContainer = document.getElementById('loading-container');
            const menuContainer = document.getElementById('menu-container');

            if (!progressBar || !loadingContainer || !menuContainer) {
                console.error('Required elements not found');
                return;
            }

            // 强制触发重排以确保动画生效
            void progressBar.offsetWidth;

            // 设置进度条
            progressBar.style.width = '100%';

            // 监听过渡结束事件
            progressBar.addEventListener('transitionend', function () {
                console.log('Progress bar animation completed');
                loadingContainer.style.display = 'none';
                menuContainer.style.display = 'block';
            });

            // 添加超时保护
            setTimeout(() => {
                if (loadingContainer.style.display !== 'none') {
                    console.log('Timeout triggered - forcing menu display');
                    loadingContainer.style.display = 'none';
                    menuContainer.style.display = 'block';
                }
            }, 2000); // 2秒后强制显示菜单
        });

        // 对战AI功能
        function startAiGame() {
            const userId = sessionStorage.getItem('userId');

            fetch('/aiBot/start', {
                method: 'GET',
                headers: {
                    'Accept': 'text/html'
                }
            })
                .then(response => response.text())
                .then(html => {
                    // 完全清除当前页面
                    document.open();
                    document.write(html);
                    document.close();

                    // 确保在页面完全加载后初始化
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', function () {
                            if (typeof initializeGame === 'function') {
                                initializeGame();
                            }
                        });
                    } else {
                        if (typeof initializeGame === 'function') {
                            initializeGame();
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('启动AI对战失败，请稍后重试！');
                });
        }

        // 绑定点击事件到对战AI按钮
        document.getElementById('play-ai').addEventListener('click', startAiGame);

        // 退出游戏 - 关闭网页
        document.getElementById('exit-game').addEventListener('click', function () {
            const userId = sessionStorage.getItem('userId');

            // 清理登录状态
            if (userId) {
                try {
                    const data = new Blob([JSON.stringify({
                        userId: userId,
                        type: 'manual',
                        gameType: 0
                    })], { type: 'application/json' });

                    // 优先用 sendBeacon 通知后端登出
                    navigator.sendBeacon('/user/logout', data);
                } catch (e) {
                    console.warn('logout beacon failed:', e);
                }
            }

            try {
                sessionStorage.removeItem('userId');
            } catch (e) {
                console.warn('clear sessionStorage failed:', e);
            }

            // 关闭窗口
            window.close();
        });

        // 返回登录界面并结束登录状态
        document.getElementById('back-to-entry').addEventListener('click', function () {
            const userId = sessionStorage.getItem('userId');

            try {
                sessionStorage.removeItem('userId');
            } catch (e) {
                console.warn('clear sessionStorage failed:', e);
            }

            if (userId) {
                try {
                    const data = new Blob([JSON.stringify({
                        userId: userId,
                        type: 'manual',
                        gameType: 0
                    })], { type: 'application/json' });

                    // 优先用 sendBeacon 通知后端登出
                    const ok = navigator.sendBeacon('/user/logout', data);

                    if (!ok) {
                        // 退化为普通异步请求，但不阻塞跳转
                        fetch('/user/logout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userId: userId,
                                type: 'manual',
                                gameType: 0
                            })
                        }).catch(err => console.warn('logout fallback failed:', err));
                    }
                } catch (e) {
                    console.warn('logout beacon failed:', e);
                }
            }

            // 立即跳转到登录页
            window.location.href = '/entry';
        });

        // 添加页面刷新/关闭时的处理
        window.addEventListener('beforeunload', function (e) {
            const userId = sessionStorage.getItem('userId');
            if (userId) {
                try {
                    // 创建 Blob 对象，指定 content-type
                    const data = new Blob([JSON.stringify({
                        userId: userId,
                        type: 'refresh',
                        gameType: 0
                    })], { type: 'application/json' });

                    // 使用 navigator.sendBeacon 发送异步请求
                    const success = navigator.sendBeacon('/user/logout', data);

                    // 如果 sendBeacon 失败，尝试使用同步 XMLHttpRequest
                    if (!success) {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', '/user/logout', false); // 同步请求
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify({
                            userId: userId,
                            type: 'refresh',
                            gameType: 0
                        }));
                    }
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }
        });

        // 添加页面加载时的用户检查
        window.addEventListener('load', function () {
            const userId = sessionStorage.getItem('userId');
            if (!userId) {
                window.location.href = '/entry';
                return;
            }
        });
    </script>
</body>

</html>
