<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级无敌宇宙miniGomoku</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 全局样式 */
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at top, #0f172a 0, #020617 40%, #020309 100%);
            position: relative;
            color: #e5edff;
            overflow: hidden;
        }

        /* 背景装饰 */
        .board-glow {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.35), transparent 70%);
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(10px);
            z-index: 0;
        }

        .side-glow {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: conic-gradient(from 140deg, rgba(56, 189, 248, 0.3), transparent, rgba(129, 140, 248, 0.5));
            right: -120px;
            bottom: -80px;
            filter: blur(40px);
            opacity: 0.7;
        }

        /* 标题样式 */
        h1 {
            margin-bottom: 18px;
            color: #e5edff;
            text-shadow: 0 10px 25px rgba(15, 23, 42, 0.8);
            letter-spacing: 3px;
            font-size: 28px;
            z-index: 1;
        }

        .page-subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-top: -6px;
            margin-bottom: 10px;
            z-index: 1;
        }

        /* 游戏控制区样式 */
        .game-container {
            display: flex;
            align-items: flex-start;
            position: relative;
            z-index: 1;
            gap: 28px;
            padding: 18px 24px 22px;
            border-radius: 22px;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.16), rgba(15, 23, 42, 0.98));
            box-shadow:
                0 32px 70px rgba(15, 23, 42, 0.95),
                0 0 0 1px rgba(148, 163, 255, 0.32);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* 棋盘样式 */
        #board {
            display: grid;
            grid-template-columns: repeat(15, 40px);
            grid-template-rows: repeat(15, 40px);
            gap: 0;
            border-radius: 18px;
            border: 1px solid rgba(15, 23, 42, 0.9);
            background: linear-gradient(145deg, #e6c087, #d0a96c);
            box-shadow:
                inset 0 0 0 1px rgba(0, 0, 0, 0.18),
                0 20px 40px rgba(15, 23, 42, 0.9);
            position: relative;
            margin: 6px auto 12px;
            -webkit-user-select: none;
            user-select: none;
        }

        .cell {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(87, 65, 36, 0.7);
            position: relative;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .cell::before {
            /* 细微高光 */
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 2px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 40%, rgba(0, 0, 0, 0.05));
            opacity: 0.4;
            pointer-events: none;
        }

        .cell.black::after,
        .cell.white::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
        }

        .cell.black::after {
            background: radial-gradient(circle at 25% 20%, #555, #000);
        }

        .cell.white::after {
            background: radial-gradient(circle at 25% 20%, #fff, #d1d5db);
            border: 1px solid #000;
        }

        /* 胜负结果提示框 */
        #result {
            margin-top: 6px;
            font-size: 16px;
            color: #f97316;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
        }

        /* 右侧控制面板 */
        .control-panel {
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .difficulty-display {
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 255, 0.4);
            font-size: 13px;
            color: #e5edff;
        }

        .panel-title {
            font-size: 15px;
            margin-bottom: 4px;
            color: #c7d2fe;
        }

        .turn-indicator {
            padding: 6px 10px;
            border-radius: 999px;
            background: radial-gradient(circle at left, rgba(34, 197, 94, 0.35), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(34, 197, 94, 0.6);
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .turn-indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.45);
        }

        .control-btn {
            padding: 9px 16px;
            font-size: 14px;
            cursor: pointer;
            background: linear-gradient(135deg, #4ade80, #16a34a);
            color: white;
            border: none;
            border-radius: 999px;
            transition: all 0.18s ease;
            box-shadow: 0 12px 30px rgba(22, 163, 74, 0.45);
            text-align: center;
        }

        .control-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 38px rgba(22, 163, 74, 0.55);
        }

        .control-btn:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.95);
        }

        .control-btn.return {
            background: linear-gradient(135deg, #f97373, #ef4444);
            box-shadow: 0 12px 30px rgba(239, 68, 68, 0.45);
        }

        .control-btn.return:hover {
            box-shadow: 0 16px 38px rgba(239, 68, 68, 0.6);
        }

        .control-select {
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 255, 0.5);
            background: rgba(15, 23, 42, 0.85);
            color: #e5edff;
            font-size: 14px;
            outline: none;
        }

        /* 中央浮层：胜利提示 */
        #winner-display {
            font-size: 24px;
            color: #f97316;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(15, 23, 42, 0.96);
            padding: 22px 30px;
            border-radius: 16px;
            box-shadow:
                0 28px 60px rgba(15, 23, 42, 1),
                0 0 0 1px rgba(248, 250, 252, 0.04);
            z-index: 10;
        }

        /* AI 思考提示 */
        #thinking-message {
            font-size: 18px;
            color: #38bdf8;
            display: none;
            position: absolute;
            top: 16%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.7);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.9);
            z-index: 9;
        }

        /* 加载动画容器 */
        #loading-animation {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
        }

        .loader {
            border: 6px solid #111827;
            border-top: 6px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* 小屏幕适配 */
        @media (max-width: 900px) {
            body {
                padding: 12px;
            }

            .game-container {
                flex-direction: column;
                align-items: center;
                padding: 14px 14px 18px;
            }

            .control-panel {
                width: 100%;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <!-- 背景光效 -->
    <div class="board-glow"></div>
    <div class="side-glow"></div>

    <!-- 标题 -->
    <h1>超级无敌宇宙miniGomoku</h1>
    <div class="page-subtitle">您执黑先行，对战智能 AI</div>

    <!-- 游戏容器 -->
    <div class="game-container">
        <!-- 棋盘 -->
        <div>
            <div id="board"></div>
            <!-- 胜负提示 -->
            <div id="result"></div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <div class="panel-title">对局控制</div>
            <div class="turn-indicator">
                <span class="turn-indicator-dot"></span>
                <span>当前轮到：玩家（黑子）</span>
            </div>
            <div id="difficulty-display" class="difficulty-display">本局难度：--</div>
            <div class="difficulty-display" id="build-version">构建版本：2026-01-31-01</div>
            <button class="control-btn" id="restart-btn">重新开始</button>
            <button class="control-btn return" id="return-btn">返回菜单</button>
        </div>
    </div>

    <!-- 中央提示层 -->
    <div id="winner-display">恭喜你，获胜了！</div>

    <!-- AI 思考提示 -->
    <div id="thinking-message">AI 正在思考中，请稍候…</div>

    <!-- 加载动画 -->
    <div id="loading-animation">
        <div class="loader"></div>
    </div>

    <script>
        // 将所有变量声明在一个对象中管理
        const gameState = {
            boardSize: 15,
            boardState: null,
            currentPlayer: 'black',
            boardElement: null,
            resultElement: null,
            isGameActive: true,

            // 添加重置函数
            reset() {
                this.boardState = Array(this.boardSize).fill().map(() => Array(this.boardSize).fill("empty"));
                this.currentPlayer = 'black';
                this.isGameActive = true;
                if (this.resultElement) {
                    this.resultElement.textContent = '';
                }
            }
        };

        const difficultyState = {
            current: 'medium'
        };

        // 轻量点击音效（极短静音占位，避免加载大文件）
        const sounds = {
            place: (() => {
                const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=');
                a.volume = 0.35;
                return a;
            })()
        };

        // 初始化函数
        function initializeGame() {
            console.log('init game');
            gameState.boardState = Array(15).fill().map(() => Array(15).fill("empty")); // 初始化棋盘状态
            gameState.currentPlayer = 'black'; // 设置当前玩家
            gameState.isGameActive = true; // 设置游戏状态为活动
            createBoard(); // 创建棋盘
            addEventListeners(); // 添加事件监听
            setupDifficultySelector();
            ensureDifficultyDisplay();
            bindControlButtons();
        }

        function bindControlButtons() {
            const restartBtn = document.getElementById('restart-btn');
            const returnBtn = document.getElementById('return-btn');
            if (restartBtn) restartBtn.addEventListener('click', restartGame);
            if (returnBtn) returnBtn.addEventListener('click', returnToMenu);
        }

        // 兜底：如果初始化被阻断，定时检查并补救
        function ensureBoardReady() {
            const board = document.getElementById('board');
            if (!board) return;
            if (board.children.length < 200) { // 预期 225 个格子
                console.warn('board not built, rebuilding');
                createBoard();
            }
            if (!board._delegated) {
                addEventListeners();
                board._delegated = true;
            }
            if (!gameState.boardState || gameState.boardState.length === 0) {
                gameState.boardState = Array(15).fill().map(() => Array(15).fill("empty"));
            }
        }

        function ensureDifficultyDisplay() {
            const display = document.getElementById('difficulty-display');
            const urlParams = new URLSearchParams(window.location.search);
            let d = urlParams.get('difficulty') || sessionStorage.getItem('ai_difficulty') || 'medium';
            d = ['easy','medium','hard'].includes(d) ? d : 'medium';
            const map = { easy: '简单', medium: '中等', hard: '困难' };
            if (display) display.textContent = '本局难度：' + (map[d] || d);
            difficultyState.current = d;
        }

        // 创建棋盘
        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = ''; // 清空棋盘

            for (let i = 0; i < 15; i++) {
                for (let j = 0; j < 15; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    // 双保险：即使事件委托失效，逐格绑定也能工作
                    cell.addEventListener('click', handleCellClick);
                    boardElement.appendChild(cell);
                }
            }
        }

        // 添加判断落子是否合法的函数
        function isValidMove(x, y) {
            // 检查是否在棋盘范围内
            if (x < 0 || x >= 15 || y < 0 || y >= 15) {
                return false;
            }
            // 检查该位置是否已经有棋子
            if (gameState.boardState[x][y] !== "empty") {
                return false;
            }
            return true;
        }

        let isGameOver = false; // 游戏结束标志
        let isThinking = false; // AI 思考状态标志

        // 修改处理点击的函数
        function handleCellClick(event) {
            if (isGameOver || !gameState.isGameActive || isThinking || !event.target.classList.contains('cell')) return;

            const cell = event.target;
            const x = parseInt(cell.dataset.row);
            const y = parseInt(cell.dataset.col);
            console.log('click cell', {x, y});

            // 前端先判断是否合法
            if (!isValidMove(x, y)) {
                alert('此位置不能落子！');
                return;
            }

            // 立即在前端显示棋子
            cell.classList.add('black'); // 添加黑色棋子类
            gameState.boardState[x][y] = 'black'; // 更新游戏状态
            gameState.currentPlayer = 'white'; // 切换到下一个玩家
            try { sounds.place.currentTime = 0; sounds.place.play(); } catch (e) {}

            // 显示思考提示
            showThinkingMessage();

            // 发送请求到服务器
            isThinking = true; // 设置思考状态
            fetch('/aiBot/move', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({ x, y })
            })
                .then(response => {
                    // Check for 401 Unauthorized status
                    if (response.status === 401) {
                        // Session expired or not logged in, redirect to login page
                        // The redirect will interrupt execution, so no need to reject promise
                        window.location.replace('/entry');
                        return new Promise(() => {}); // Return a never-resolving promise to prevent further processing
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('move response', data);
                    isThinking = false; // 重置思考状态
                    hideThinkingMessage(); // 隐藏思考提示

                    // 处理游戏结果
                    if (data.winner && data.winner !== 'none') {
                        isGameOver = true; // 设置游戏结束标志
                        hideThinkingMessage(); // 隐藏思考提示
                        if (data.winner !== 'human') {
                            if (data.last_move) {
                                const aiMove = data.last_move;
                                const aiCell = document.querySelector(
                                    `[data-row="${aiMove.x}"][data-col="${aiMove.y}"]`
                                );
                                if (aiCell) {
                                    aiCell.classList.add('white'); // 添加白色棋子类
                                    gameState.boardState[aiMove.x][aiMove.y] = 'white'; // 更新游戏状态
                                }
                            }
                            gameState.currentPlayer = 'black'; // 切换回人类玩家
                        }
                        setTimeout(() => {
                            let msg = '游戏结束';
                            if (data.winner === 'human') msg = '恭喜你，获胜了！';
                            else if (data.winner === 'ai') msg = 'AI获胜！';
                            else if (data.winner === 'draw') msg = '平局！';
                            
                            alert(msg);
                            displayWinner(data.winner); // 显示获胜方
                            disableBoard(); // 禁用棋盘
                        }, 100);
                        return; 
                    }

                    if (data.status === 'error') {
                        // 如果服务器返回错误，回滚前端的改动
                        if (data.message === 'Unauthorized') {
                            // 会话失效，直接重定向到登录页，不弹窗打断用户
                            // 使用 replace 避免用户点后退按钮陷入死循环
                            window.location.replace('/entry'); 
                            return;
                        }
                        alert(data.message);
                        return;
                    }

                    // 显示 AI 的落子
                    if (data.last_move) {
                        const aiMove = data.last_move;
                        const aiCell = document.querySelector(
                            `[data-row="${aiMove.x}"][data-col="${aiMove.y}"]`
                        );
                        if (aiCell) {
                            aiCell.classList.add('white'); // 添加白色棋子类
                            gameState.boardState[aiMove.x][aiMove.y] = 'white'; // 更新游戏状态
                        }
                        gameState.currentPlayer = 'black'; // 切换回人类玩家
                        try { sounds.place.currentTime = 0; sounds.place.play(); } catch (e) {}
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    alert('网络请求失败: ' + error.message);
                    isThinking = false;
                    hideThinkingMessage();
                });
        }

        // 显示获胜方
        function displayWinner(winner) {
            const winnerDisplay = document.getElementById('winner-display');
            winnerDisplay.textContent = winner === 'human' ? '恭喜你，获胜了！' : 'AI获胜！';
            winnerDisplay.style.display = 'block'; // 显示获胜信息
        }

        // 禁用棋盘
        function disableBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.removeEventListener('click', handleCellClick); // 移除点击事件
            });
        }

        // 重新开始游戏
        function restartGame() {
            isGameOver = false; // 重置游戏结束标志
            isThinking = false; // 重置 AI 思考状态标志
            gameState.boardState = Array(15).fill().map(() => Array(15).fill("empty")); // 重新初始化棋盘状态
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.classList.remove('black', 'white'); // 移除所有棋子类
                cell.addEventListener('click', handleCellClick); // 重新添加点击事件
            });
            document.getElementById('winner-display').style.display = 'none'; // 隐藏获胜信息
            document.getElementById('thinking-message').style.display = 'none'; // 隐藏思考提示
            document.getElementById('loading-animation').style.display = 'none'; // 隐藏加载动画
            gameState.currentPlayer = 'black'; // 重置当前玩家
            gameState.isGameActive = true; // 重置游戏状态
        }

        // 添加事件监听
        function addEventListeners() {
            const board = document.getElementById('board');
            if (!board) return;
            // 事件委托，确保所有格子（包括重建后）都能响应
            board.addEventListener('click', function (e) {
                const cell = e.target.closest('.cell');
                if (!cell || !board.contains(cell)) return;
                // 构造伪事件对象，复用现有处理函数
                handleCellClick({ target: cell });
            });
            // 触摸支持，降低移动端延迟
            board.addEventListener('touchstart', function (e) {
                const cell = e.target.closest('.cell');
                if (!cell || !board.contains(cell)) return;
                e.preventDefault();
                handleCellClick({ target: cell });
            }, { passive: false });
        }

        function setupDifficultySelector() {
            const select = document.getElementById('difficulty-select');
            const display = document.getElementById('difficulty-display');
            const urlParams = new URLSearchParams(window.location.search);
            let d = urlParams.get('difficulty') || sessionStorage.getItem('ai_difficulty') || 'medium';
            d = ['easy','medium','hard'].includes(d) ? d : 'medium';
            difficultyState.current = d;
            if (select) {
                select.value = d;
                select.disabled = true;
            }
            if (display) {
                const map = { easy: '简单', medium: '中等', hard: '困难' };
                display.textContent = '本局难度：' + (map[d] || d);
            }
        }

        // 添加返回菜单函数
        function returnToMenu() {
            isGameOver = false; // 重置游戏结束标志
            isThinking = false; // 重置 AI 思考状态标志
            // 显示加载状态
            document.body.innerHTML = `
                <div id="loading-container">
                    <div id="loading-title">超级无敌宇宙miniGomoku</div>
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                    <div id="loading-text">加载中...</div>
                </div>
            `;

            // 清理游戏状态
            gameState.reset();

            fetch('/menu', {
                method: 'GET',
                headers: {
                    'Accept': 'text/html'
                }
            })
                .then(response => {
                    // Check for 401 Unauthorized status
                    if (response.status === 401) {
                        // Session expired or not logged in, redirect to login page
                        // The redirect will interrupt execution, so no need to reject promise
                        window.location.replace('/entry');
                        return new Promise(() => {}); // Return a never-resolving promise to prevent further processing
                    }
                    if (!response.ok) {
                        throw new Error('返回菜单失败');
                    }
                    return response.text();
                })
                .then(html => {
                    // 使用 document.open/write/close 完全重置页面
                    document.open();
                    document.write(html);
                    document.close();

                    // 确保在页面加载完成后重新绑定事件
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', function () {
                            const playAiButton = document.getElementById('play-ai');
                            if (playAiButton) {
                                playAiButton.addEventListener('click', startAiGame);
                            }
                        });
                    } else {
                        const playAiButton = document.getElementById('play-ai');
                        if (playAiButton) {
                            playAiButton.addEventListener('click', startAiGame);
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('返回菜单失败，请重试！');
                    // 恢复游戏界面
                    location.reload();
                });
        }

        // 添加必要的加载状态样式
        const loadingStyles = `
        <style>
            #loading-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                text-align: center;
                background-color: #0f172a;
                color: #e5edff;
            }

            #loading-title {
                font-size: 2em;
                margin-bottom: 20px;
                color: #e5edff;
            }

            .progress-bar {
                width: 260px;
                height: 10px;
                background-color: #111827;
                border-radius: 999px;
                overflow: hidden;
                margin: 20px 0;
            }

            .progress {
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, #38bdf8, #6366f1);
                animation: progress 2s ease-in-out infinite;
            }

            #loading-text {
                color: #9ca3af;
                font-size: 0.95em;
            }

            @keyframes progress {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(100%); }
            }
        </style>
        `;

        // 在页面加载时添加样式
        document.head.insertAdjacentHTML('beforeend', loadingStyles);

        // 全局错误兜底，便于前端可视化排查
        window.addEventListener('error', function (e) {
            console.error('Global error', e.message, e.filename, e.lineno);
            const res = document.getElementById('result');
            if (res) {
                res.textContent = '前端脚本错误: ' + e.message;
            }
        });

        function boot() {
            try {
                initializeGame();
            } catch (err) {
                console.error('init failed', err);
                const res = document.getElementById('result');
                if (res) res.textContent = '初始化失败: ' + err.message;
            }
            setTimeout(ensureBoardReady, 150);
            setTimeout(ensureDifficultyDisplay, 120);
            // 兜底：暴露给全局，避免内联调用报错
            window.restartGame = restartGame;
            window.returnToMenu = returnToMenu;
            const res = document.getElementById('result');
            if (res) res.textContent = '脚本已初始化';
        }

        // 直接执行（脚本位于 body 末尾，DOM 已就绪）；同时保留兜底定时器
        boot();
        window.onload = function () { try { boot(); } catch (e) {} };

        // 添加页面刷新/关闭时的处理
        window.addEventListener('beforeunload', function (e) {
            const userId = sessionStorage.getItem('userId');
            if (userId) {
                // 创建 Blob 对象，指定 content-type
                const data = new Blob([JSON.stringify({
                    userId: userId,
                    type: 'refresh',
                    gameType: 0
                })], { type: 'application/json' });  // 设置正确的 Content-Type

                // 使用 navigator.sendBeacon 发送异步请求
                navigator.sendBeacon('/user/logout', data);
            }
        });

        // 确保在页面加载时从 sessionStorage 获取 userId
        //document.addEventListener('DOMContentLoaded', function () {
          //  const userId = sessionStorage.getItem('userId');
            //if (!userId) {
                // 如果没有 userId，重定向到登录页面
              //  window.location.href = '/entry';
           // }
        //});

        // 显示思考提示和加载动画
        function showThinkingMessage() {
            const thinkingMessage = document.getElementById('thinking-message');
            const loadingAnimation = document.getElementById('loading-animation');
            thinkingMessage.style.display = 'block'; // 显示提示
            loadingAnimation.style.display = 'block'; // 显示加载动画
        }

        // 隐藏思考提示和加载动画
        function hideThinkingMessage() {
            const thinkingMessage = document.getElementById('thinking-message');
            const loadingAnimation = document.getElementById('loading-animation');
            thinkingMessage.style.display = 'none'; // 隐藏提示
            loadingAnimation.style.display = 'none'; // 隐藏加载动画
        }
    </script>
</body>

</html>
